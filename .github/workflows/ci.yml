name: CI

# No paths-ignore: branch protection requires `ci-gate`, and a workflow skipped by paths-ignore
# never reports it, so a docs-only PR could never merge. The `changes` job decides instead.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch cancels the older run — saves Actions minutes on the private repo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Anything outside docs/** and *.md counts as code. Unknown ranges (first push, force push)
      # count as code too, so a missing base can only cause an extra run, never a skipped one.
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD_SHA" | grep -v -E '^docs/|\.md$' | grep -q .; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: typecheck · lint · test · lint:docs
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # ADR-0006 — CI runs the same compose Postgres as dev, not `services: postgres`,
      # so statement_timeout and lock_timeout match. Throwaway passwords, never secrets.
      - name: Local infra (Postgres 16 + Redis 7)
        run: |
          {
            echo "POSTGRES_OWNER_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_APP_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_AUTH_PASSWORD=$(openssl rand -hex 24)"
            echo "REDIS_PASSWORD=$(openssl rand -hex 24)"
          } > .env
          pnpm infra:up

      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: pnpm check
        run: pnpm check

  # The one check branch protection requires. It passes when `check` passed, or when `check` was
  # skipped because only docs changed — and fails on anything else, including a failed `changes`.
  gate:
    name: ci-gate
    needs: [changes, check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CHECK: ${{ needs.check.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "changes=$CHANGES check=$CHECK code=$CODE"
          [ "$CHANGES" = "success" ] || exit 1
          if [ "$CODE" = "true" ]; then [ "$CHECK" = "success" ]; else [ "$CHECK" = "skipped" ]; fi
