name: CI

# No paths-ignore: branch protection requires `ci-gate`, and a workflow skipped by paths-ignore
# never reports it, so a docs-only PR could never merge. The `changes` job decides instead.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch cancels the older run — saves Actions minutes on the private repo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: detect code changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Only a pull request may skip the heavy job. Every push to main runs it, so a run cancelled by a
      # later docs-only push cannot leave a code commit on main untested.
      # Fails closed: an unknown base or any git error counts as code. --no-renames makes a rename out of
      # src/ into docs/ show its deleted source path; -z reads raw file names, which git would otherwise quote.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          code=true
          files="$(mktemp)"
          if [ "$EVENT" = "pull_request" ] && [ -n "$BASE" ] \
            && git diff --no-renames --name-only -z "$BASE" "$HEAD_SHA" > "$files"; then
            code=false
            while IFS= read -r -d '' path; do
              case "$path" in
                # The module map is an executable input of the gate: its markdown generates the checked YAML.
                docs/module-map.md|docs/module-map.yaml) code=true; break ;;
                docs/*|*.md) ;;
                *) code=true; break ;;
              esac
            done < "$files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  check:
    name: typecheck · lint · test · lint:docs
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Per-task duration and cache status for the telemetry report; it does not change any task hash.
    env:
      TURBO_RUN_SUMMARY: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          # #859: مقارنة المرشح بأساس الـmerged محتاجة تاريخ كامل في job الـcheck نفسه.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # ADR-0006 — CI runs the same compose Postgres as dev, not `services: postgres`,
      # so statement_timeout and lock_timeout match. Throwaway passwords, never secrets.
      - name: Local infra (Postgres 16 + Redis 7)
        run: |
          {
            echo "POSTGRES_OWNER_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_APP_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_AUTH_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_DISPATCHER_PASSWORD=$(openssl rand -hex 24)"
            echo "REDIS_PASSWORD=$(openssl rand -hex 24)"
          } > .env
          pnpm infra:up

      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # The gate order of plan v4 T12b / CLAUDE.md §10, one step each so a failure names its gate. RLS negative
      # suites and EXPLAIN assertions run inside the integration step (packages/db, apps/api queries/).
      - name: typecheck
        run: pnpm turbo run typecheck

      - name: lint (incl. max-lines and boundaries)
        run: pnpm turbo run lint

      - name: lint:docs
        run: pnpm lint:docs

      - name: cycles · module-map
        run: |
          node --test "scripts/module-map/*.test.mjs" "scripts/roadmap/*.test.mjs" "scripts/test-db/*.test.mjs"
          pnpm module-map:check

      # #859: the base is the pull request's base SHA or the push's previous main tip, so a
      # multi-commit push is compared against what it replaced, never against HEAD^.
      - name: migration chain
        env:
          MIGRATION_CHAIN_BASE_SHA: >-
            ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha ||
            github.event_name == 'push' && github.event.before || '' }}
        run: |
          node --test "scripts/migration-chain/*.test.mjs"
          pnpm migration-chain:check --base "$MIGRATION_CHAIN_BASE_SHA"

      # Generated API types: the admin and POS clients must match the committed OpenAPI document. PP-72.2 moved these
      # two checks here from the removed full workspace check job; the rest of `pnpm check` runs in check and api-tests.
      - name: api:check · admin
        run: pnpm --filter @pospay/admin api:check

      - name: api:check · pos
        run: pnpm --filter @pospay/pos api:check

      # The telemetry code is a required check of its own: a broken report is a broken measurement.
      - name: ci-telemetry self-test
        run: node --test "scripts/ci-telemetry/*.test.mjs"

      # API domain specs run here via vitest.unit.config.ts with no Postgres.
      # The default config also runs them inside the parallel integration shards (PP-131.1).
      - name: unit (domain)
        run: |
          pnpm turbo run test --filter=@pospay/domain
          pnpm --filter @pospay/api test:unit

      # The integration suites run in parallel jobs: packages in `packages-tests`, apps/api in the eight
      # `api-tests` shards, the worker in the four `worker-tests` shards.

      # With `continue-on-error`, a telemetry failure shows as step `outcome: failure` while its
      # `conclusion` is `success`, so the gate steps alone decide the job.
      - name: telemetry · report
        if: always()
        continue-on-error: true
        env:
          CI_TELEMETRY_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_TELEMETRY_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          CI_TELEMETRY_PNPM_VERSION="$(pnpm --version 2>/dev/null || true)"
          CI_TELEMETRY_CHECKOUT_SHA="$(git rev-parse HEAD)"
          export CI_TELEMETRY_PNPM_VERSION CI_TELEMETRY_CHECKOUT_SHA
          node scripts/ci-telemetry/cli.mjs --label check --turbo-runs .turbo/runs --out "$RUNNER_TEMP/ci-telemetry"

      # Best-effort: a hard cancel can skip it, so an artifact is not guaranteed.
      - name: telemetry · upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-telemetry-check-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-telemetry/
          retention-days: 14
          if-no-files-found: warn

  # Package integration · RLS negative · EXPLAIN, moved out of `check` into its own job.
  # It starts alongside the static gates and app test shards.
  packages-tests:
    name: integration · packages
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Per-task duration and cache status for the telemetry report; it does not change any task hash.
    env:
      TURBO_RUN_SUMMARY: 'true'
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Chromium headless shell (spec 056)
        run: pnpm --filter @pospay/documents exec node scripts/install-headless-shell.mjs

      - name: Local infra (Postgres 16 + Redis 7)
        run: |
          {
            echo "POSTGRES_OWNER_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_APP_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_AUTH_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_DISPATCHER_PASSWORD=$(openssl rand -hex 24)"
            echo "REDIS_PASSWORD=$(openssl rand -hex 24)"
          } > .env
          pnpm infra:up

      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-packages-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-packages-
            turbo-${{ runner.os }}-

      - name: integration · RLS negative · EXPLAIN (packages)
        run: pnpm turbo run test --filter=!@pospay/domain --filter=!@pospay/api --filter=!@pospay/worker

      # With `continue-on-error`, a telemetry failure shows as step `outcome: failure` while its
      # `conclusion` is `success`, so the gate steps alone decide the job.
      - name: telemetry · report
        if: always()
        continue-on-error: true
        env:
          CI_TELEMETRY_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_TELEMETRY_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          CI_TELEMETRY_PNPM_VERSION="$(pnpm --version 2>/dev/null || true)"
          CI_TELEMETRY_CHECKOUT_SHA="$(git rev-parse HEAD)"
          export CI_TELEMETRY_PNPM_VERSION CI_TELEMETRY_CHECKOUT_SHA
          node scripts/ci-telemetry/cli.mjs --label packages-tests --turbo-runs .turbo/runs --out "$RUNNER_TEMP/ci-telemetry"

      # Best-effort: a hard cancel can skip it, so an artifact is not guaranteed.
      - name: telemetry · upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-telemetry-packages-tests-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-telemetry/
          retention-days: 14
          if-no-files-found: warn

  # apps/api integration · RLS negative · EXPLAIN, split into eight parallel shards (vitest --shard): each shard brings
  # up its own compose Postgres (ADR-0006) and runs an eighth of the spec files. Public repo → free runners.
  # PP-131.1: shards start alongside `check`; ci-gate still requires every job to succeed.
  api-tests:
    name: api tests ${{ matrix.shard }}/8
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Per-task duration and cache status for the telemetry report; it does not change any task hash.
    env:
      TURBO_RUN_SUMMARY: 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Local infra (Postgres 16 + Redis 7)
        run: |
          {
            echo "POSTGRES_OWNER_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_APP_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_AUTH_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_DISPATCHER_PASSWORD=$(openssl rand -hex 24)"
            echo "REDIS_PASSWORD=$(openssl rand -hex 24)"
          } > .env
          pnpm infra:up

      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-api-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-api-${{ matrix.shard }}-
            turbo-${{ runner.os }}-

      # the built-production smoke spec (files/production.spec.ts) starts dist/main.js of api AND worker
      - name: build api, worker and their dependencies
        run: pnpm turbo run build --filter=@pospay/api... --filter=@pospay/worker...

      - name: api integration · RLS negative · EXPLAIN (shard ${{ matrix.shard }}/8)
        run: pnpm --filter @pospay/api exec vitest run --shard=${{ matrix.shard }}/8

      # With `continue-on-error`, a telemetry failure shows as step `outcome: failure` while its
      # `conclusion` is `success`, so the gate steps alone decide the job.
      - name: telemetry · report
        if: always()
        continue-on-error: true
        env:
          CI_TELEMETRY_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_TELEMETRY_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          CI_TELEMETRY_PNPM_VERSION="$(pnpm --version 2>/dev/null || true)"
          CI_TELEMETRY_CHECKOUT_SHA="$(git rev-parse HEAD)"
          export CI_TELEMETRY_PNPM_VERSION CI_TELEMETRY_CHECKOUT_SHA
          node scripts/ci-telemetry/cli.mjs --label api-tests-shard-${{ matrix.shard }} --turbo-runs .turbo/runs --out "$RUNNER_TEMP/ci-telemetry"

      # Best-effort: a hard cancel can skip it, so an artifact is not guaranteed.
      - name: telemetry · upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-telemetry-api-tests-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-telemetry/
          retention-days: 14
          if-no-files-found: warn

  worker-tests:
    name: integration · worker ${{ matrix.shard }}/4
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Per-task duration and cache status for the telemetry report; it does not change any task hash.
    env:
      TURBO_RUN_SUMMARY: 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Chromium headless shell (spec 056)
        run: pnpm --filter @pospay/documents exec node scripts/install-headless-shell.mjs

      - name: Local infra (Postgres 16 + Redis 7)
        run: |
          {
            echo "POSTGRES_OWNER_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_APP_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_AUTH_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_DISPATCHER_PASSWORD=$(openssl rand -hex 24)"
            echo "REDIS_PASSWORD=$(openssl rand -hex 24)"
          } > .env
          pnpm infra:up

      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-worker-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-worker-${{ matrix.shard }}-
            turbo-${{ runner.os }}-worker-
            turbo-${{ runner.os }}-

      # turbo.json chains worker#test → api#test, so selecting the worker through turbo would run the whole api
      # suite again unsharded: the worker is excluded from turbo test and run directly by vitest here.
      # Build and test are separate steps so the timings show each on its own.
      - name: build worker and its dependencies
        run: pnpm turbo run build --filter=@pospay/worker...

      - name: integration · worker (shard ${{ matrix.shard }}/4)
        run: pnpm --filter @pospay/worker exec vitest run --shard=${{ matrix.shard }}/4

      # With `continue-on-error`, a telemetry failure shows as step `outcome: failure` while its
      # `conclusion` is `success`, so the gate steps alone decide the job.
      - name: telemetry · report
        if: always()
        continue-on-error: true
        env:
          CI_TELEMETRY_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_TELEMETRY_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          CI_TELEMETRY_PNPM_VERSION="$(pnpm --version 2>/dev/null || true)"
          CI_TELEMETRY_CHECKOUT_SHA="$(git rev-parse HEAD)"
          export CI_TELEMETRY_PNPM_VERSION CI_TELEMETRY_CHECKOUT_SHA
          node scripts/ci-telemetry/cli.mjs --label worker-tests-shard-${{ matrix.shard }} --turbo-runs .turbo/runs --out "$RUNNER_TEMP/ci-telemetry"

      # Best-effort: a hard cancel can skip it, so an artifact is not guaranteed.
      - name: telemetry · upload
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-telemetry-worker-tests-shard-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-telemetry/
          retention-days: 14
          if-no-files-found: warn

  # Starts with the independent test jobs; ci-gate still requires every test job and this build to succeed.
  build:
    name: build all apps
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-build-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-build-
            turbo-${{ runner.os }}-

      - name: build all apps
        run: pnpm turbo run build

  # CLAUDE.md §10 — images are built on every code change, and pushed to GHCR tagged by the commit SHA (never `latest`)
  # only from main. Plain docker CLI, no third-party action: the token below is the run's own, scoped to this repo.
  images:
    name: docker images
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      SHA: ${{ github.sha }}
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      STAGING_API_URL: https://api.staging.pospay.systems
      STAGING_POS_URL: https://pos.staging.pospay.systems
      PRODUCTION_API_URL: https://api.pospay.systems
      PRODUCTION_POS_URL: https://pos.pospay.systems
    steps:
      - uses: actions/checkout@v7

      # Decoy env files are planted before the build, so the check below proves .dockerignore keeps them out — of the
      # build stage too, whose layers hold the whole context — rather than passing because none existed.
      - name: plant decoy env files
        run: |
          for file in .env .env.production apps/api/.env apps/api/.env.production apps/admin/.env apps/pos/.env packages/db/.env.local deploy/backup/backup.env; do
            echo "DECOY=never-in-an-image" > "$file"
          done

      # Build the shared stage alone, then cap target builds at two processes to contain runner memory use.
      - name: build api · migrate · worker · backup · postgres · admin · pos (and the build stage)
        run: |
          set -euo pipefail
          registry="$(echo "$REGISTRY" | tr '[:upper:]' '[:lower:]')"
          echo "REGISTRY_LC=$registry" >> "$GITHUB_ENV"
          docker build -f deploy/Dockerfile.api --target build -t pospay-build-stage:check .
          pids=()
          failed=0
          build_target() {
            "$@" &
            pids+=("$!")
            if [ "${#pids[@]}" -eq 2 ]; then
              if ! wait "${pids[0]}"; then failed=1; fi
              pids=("${pids[@]:1}")
            fi
          }
          build_target docker build -f deploy/Dockerfile.api --target api -t "$registry/pospay-api:$SHA" .
          build_target docker build -f deploy/Dockerfile.api --target migrate -t "$registry/pospay-migrate:$SHA" .
          build_target docker build -f deploy/Dockerfile.worker -t "$registry/pospay-worker:$SHA" .
          build_target docker build -f deploy/Dockerfile.backup -t "$registry/pospay-backup:$SHA" .
          build_target docker build -f deploy/Dockerfile.postgres -t "$registry/pospay-postgres:$SHA" .
          build_target docker build -f deploy/Dockerfile.admin --build-arg NEXT_PUBLIC_POS_URL="$PRODUCTION_POS_URL" -t "$registry/pospay-admin:$SHA" .
          build_target docker build -f deploy/Dockerfile.pos -t "$registry/pospay-pos:$SHA" .
          if [ "$PUSH" = "true" ]; then
            build_target docker build -f deploy/Dockerfile.admin --build-arg NEXT_PUBLIC_API_URL="$STAGING_API_URL" --build-arg NEXT_PUBLIC_POS_URL="$STAGING_POS_URL" -t "$registry/pospay-admin-staging:$SHA" .
            build_target docker build -f deploy/Dockerfile.pos --build-arg VITE_API_URL="$STAGING_API_URL" -t "$registry/pospay-pos-staging:$SHA" .
            build_target docker build -f deploy/Dockerfile.admin --build-arg NEXT_PUBLIC_API_URL="$PRODUCTION_API_URL" --build-arg NEXT_PUBLIC_POS_URL="$PRODUCTION_POS_URL" -t "$registry/pospay-admin-prod:$SHA" .
            build_target docker build -f deploy/Dockerfile.pos --build-arg VITE_API_URL="$PRODUCTION_API_URL" -t "$registry/pospay-pos-prod:$SHA" .
          fi
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then failed=1; fi
          done
          [ "$failed" -eq 0 ]

      - name: no env file in any image or build stage
        run: |
          set -euo pipefail
          leaked=0
          images="pospay-build-stage:check $REGISTRY_LC/pospay-api:$SHA"
          images="$images $REGISTRY_LC/pospay-migrate:$SHA $REGISTRY_LC/pospay-worker:$SHA $REGISTRY_LC/pospay-backup:$SHA"
          images="$images $REGISTRY_LC/pospay-admin:$SHA"
          images="$images $REGISTRY_LC/pospay-pos:$SHA $REGISTRY_LC/pospay-postgres:$SHA"
          if [ "$PUSH" = "true" ]; then
            images="$images $REGISTRY_LC/pospay-admin-staging:$SHA $REGISTRY_LC/pospay-pos-staging:$SHA"
            images="$images $REGISTRY_LC/pospay-admin-prod:$SHA $REGISTRY_LC/pospay-pos-prod:$SHA"
          fi
          search='find / \( -name ".env" -o -name ".env.*" -o -name "*.env" \) ! -name "*.env.example" ! -name ".env.example" -not -path "/proc/*" 2>/dev/null; true'
          for image in $images; do
            # A failed inspection fails the step (set -e); it never counts as "nothing found".
            found="$(docker run --rm --entrypoint sh "$image" -c "$search")"
            if [ -n "$found" ]; then echo "::error::$image contains: $found"; leaked=1; fi
          done
          [ "$leaked" -eq 0 ]

      - name: push (main only)
        if: env.PUSH == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for image in api migrate worker backup postgres admin pos admin-staging pos-staging admin-prod pos-prod; do docker push "$REGISTRY_LC/pospay-$image:$SHA"; done

  admin-document-popup:
    name: admin document popup · production browser
    # Its complete production build is independent of `build`; ci-gate still requires both to succeed.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:18130
      NEXT_PUBLIC_POS_URL: http://127.0.0.1:18133
      ADMIN_E2E_URL: http://127.0.0.1:18132
      ADMIN_POPUP_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build synthetic admin and its dependency closure
        run: |
          pnpm --filter @pospay/domain build
          pnpm --filter @pospay/commissions-engine build
          pnpm --filter @pospay/ids build
          pnpm --filter @pospay/observability build
          pnpm --filter @pospay/contracts build
          pnpm --filter @pospay/i18n build
          pnpm --filter @pospay/db build
          pnpm --filter @pospay/auth build
          pnpm --filter @pospay/admin build

      - name: Install Chromium
        run: pnpm --filter @pospay/admin exec playwright install --with-deps chromium

      - name: Exercise the real staff route and native popup lifecycle
        run: |
          set -euo pipefail
          fixture_pid=''
          admin_pid=''
          cleanup() {
            if [ -n "$admin_pid" ]; then kill "$admin_pid" 2>/dev/null || true; fi
            if [ -n "$fixture_pid" ]; then kill "$fixture_pid" 2>/dev/null || true; fi
            if [ -n "$admin_pid" ]; then wait "$admin_pid" 2>/dev/null || true; fi
            if [ -n "$fixture_pid" ]; then wait "$fixture_pid" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          node --experimental-strip-types apps/admin/e2e/employee-document-popup-fixture.ts \
            > "$RUNNER_TEMP/employee-document-popup-fixture.log" 2>&1 &
          fixture_pid=$!
          (
            cd apps/admin
            exec node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 18132
          ) > "$RUNNER_TEMP/employee-document-popup-admin.log" 2>&1 &
          admin_pid=$!
          ready=false
          for _ in $(seq 1 60); do
            if ! kill -0 "$fixture_pid" 2>/dev/null || ! kill -0 "$admin_pid" 2>/dev/null; then
              break
            fi
            identity="$(curl -fsS http://127.0.0.1:18131/health 2>/dev/null || true)"
            if [ "$identity" = "{\"runId\":\"$ADMIN_POPUP_RUN_ID\"}" ] \
              && curl -fsS "$ADMIN_E2E_URL/staff" -o /dev/null 2>/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/employee-document-popup-fixture.log"
            cat "$RUNNER_TEMP/employee-document-popup-admin.log"
            exit 1
          fi
          pnpm --filter @pospay/admin exec playwright test employee-document-popup.pw.ts

      - name: Upload popup failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-document-popup-${{ github.run_attempt }}
          path: |
            apps/admin/test-results/
            ${{ runner.temp }}/employee-document-popup-*.log
          retention-days: 7
          if-no-files-found: ignore

  navigation-components-browser:
    name: navigation components · real browser
    # CI-only isolated component fixture: no dashboard route, adapter or deployment.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      POS_E2E_URL: http://127.0.0.1:18134
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @pospay/pos exec playwright install --with-deps chromium

      - name: Exercise navigation components at 390/820/1280px in RTL and LTR
        run: |
          set -euo pipefail
          server_pid=''
          cleanup() {
            if [ -n "$server_pid" ]; then kill "$server_pid" 2>/dev/null || true; fi
            if [ -n "$server_pid" ]; then wait "$server_pid" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          (
            cd apps/pos
            exec node node_modules/vite/bin/vite.js --config e2e/navigation-fixture/vite.config.ts
          ) > "$RUNNER_TEMP/navigation-fixture.log" 2>&1 &
          server_pid=$!
          ready=false
          for _ in $(seq 1 60); do
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            if curl -fsS "$POS_E2E_URL/" -o /dev/null 2>/dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/navigation-fixture.log"
            exit 1
          fi
          pnpm --filter @pospay/pos exec playwright test --config=playwright.navigation.config.ts

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: navigation-components-browser-${{ github.run_attempt }}
          path: |
            apps/pos/test-results/
            ${{ runner.temp }}/navigation-fixture.log
          retention-days: 7
          if-no-files-found: ignore

  # The one check branch protection requires. Code changes need every job;
  # docs-only changes need every heavy job skipped. Unknown classification and all other results fail.
  gate:
    name: ci-gate
    needs:
      [changes, check, packages-tests, api-tests, worker-tests, build, images, admin-document-popup, navigation-components-browser]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CHECK: ${{ needs.check.result }}
          PACKAGES_TESTS: ${{ needs.packages-tests.result }}
          API_TESTS: ${{ needs.api-tests.result }}
          WORKER_TESTS: ${{ needs.worker-tests.result }}
          BUILD: ${{ needs.build.result }}
          IMAGES: ${{ needs.images.result }}
          ADMIN_DOCUMENT_POPUP: ${{ needs.admin-document-popup.result }}
          NAVIGATION_COMPONENTS_BROWSER: ${{ needs.navigation-components-browser.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "changes=$CHANGES check=$CHECK packages_tests=$PACKAGES_TESTS api_tests=$API_TESTS worker_tests=$WORKER_TESTS build=$BUILD images=$IMAGES admin_document_popup=$ADMIN_DOCUMENT_POPUP navigation_components_browser=$NAVIGATION_COMPONENTS_BROWSER code=$CODE"
          [ "$CHANGES" = "success" ] || exit 1
          if [ "$CODE" = "true" ]; then
            [ "$CHECK" = "success" ] && [ "$PACKAGES_TESTS" = "success" ] && [ "$API_TESTS" = "success" ] && [ "$WORKER_TESTS" = "success" ] && [ "$BUILD" = "success" ] && [ "$IMAGES" = "success" ] && [ "$ADMIN_DOCUMENT_POPUP" = "success" ] && [ "$NAVIGATION_COMPONENTS_BROWSER" = "success" ]
          elif [ "$CODE" = "false" ]; then
            [ "$CHECK" = "skipped" ] && [ "$PACKAGES_TESTS" = "skipped" ] && [ "$API_TESTS" = "skipped" ] && [ "$WORKER_TESTS" = "skipped" ] && [ "$BUILD" = "skipped" ] && [ "$IMAGES" = "skipped" ] && [ "$ADMIN_DOCUMENT_POPUP" = "skipped" ] && [ "$NAVIGATION_COMPONENTS_BROWSER" = "skipped" ]
          else
            echo "::error::Unknown code classification: $CODE"
            exit 1
          fi
