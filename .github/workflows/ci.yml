name: CI

# No paths-ignore: branch protection requires `ci-gate`, and a workflow skipped by paths-ignore
# never reports it, so a docs-only PR could never merge. The `changes` job decides instead.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch cancels the older run — saves Actions minutes on the private repo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Only a pull request may skip the heavy job. Every push to main runs it, so a run cancelled by a
      # later docs-only push cannot leave a code commit on main untested.
      # Fails closed: an unknown base or any git error counts as code. --no-renames makes a rename out of
      # src/ into docs/ show its deleted source path; -z reads raw file names, which git would otherwise quote.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          code=true
          files="$(mktemp)"
          if [ "$EVENT" = "pull_request" ] && [ -n "$BASE" ] \
            && git diff --no-renames --name-only -z "$BASE" "$HEAD_SHA" > "$files"; then
            code=false
            while IFS= read -r -d '' path; do
              case "$path" in
                # The module map is an executable input of the gate: its markdown generates the checked YAML.
                docs/module-map.md|docs/module-map.yaml) code=true; break ;;
                docs/*|*.md) ;;
                *) code=true; break ;;
              esac
            done < "$files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  check:
    name: typecheck · lint · test · lint:docs
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # ADR-0006 — CI runs the same compose Postgres as dev, not `services: postgres`,
      # so statement_timeout and lock_timeout match. Throwaway passwords, never secrets.
      - name: Local infra (Postgres 16 + Redis 7)
        run: |
          {
            echo "POSTGRES_OWNER_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_APP_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_AUTH_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_DISPATCHER_PASSWORD=$(openssl rand -hex 24)"
            echo "REDIS_PASSWORD=$(openssl rand -hex 24)"
          } > .env
          pnpm infra:up

      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # The gate order of plan v4 T12b / CLAUDE.md §10, one step each so a failure names its gate. RLS negative
      # suites and EXPLAIN assertions run inside the integration step (packages/db, apps/api queries/).
      - name: typecheck
        run: pnpm turbo run typecheck

      - name: lint (incl. max-lines and boundaries)
        run: pnpm turbo run lint

      - name: lint:docs
        run: pnpm lint:docs

      - name: cycles · module-map
        run: |
          node --test "scripts/module-map/*.test.mjs"
          pnpm module-map:check

      - name: unit (domain)
        run: pnpm turbo run test --filter=@pospay/domain

      - name: integration · RLS negative · EXPLAIN
        run: pnpm turbo run test --filter=!@pospay/domain

      - name: build all apps
        run: pnpm turbo run build

  # The one check branch protection requires. It passes when `check` passed, or when `check` was
  # skipped because only docs changed — and fails on anything else, including a failed `changes`.
  gate:
    name: ci-gate
    needs: [changes, check]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CHECK: ${{ needs.check.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "changes=$CHANGES check=$CHECK code=$CODE"
          [ "$CHANGES" = "success" ] || exit 1
          if [ "$CODE" = "true" ]; then [ "$CHECK" = "success" ]; else [ "$CHECK" = "skipped" ]; fi
