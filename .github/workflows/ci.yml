name: CI

# No paths-ignore: branch protection requires `ci-gate`, and a workflow skipped by paths-ignore
# never reports it, so a docs-only PR could never merge. The `changes` job decides instead.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same branch cancels the older run — saves Actions minutes on the private repo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: detect code changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Only a pull request may skip the heavy job. Every push to main runs it, so a run cancelled by a
      # later docs-only push cannot leave a code commit on main untested.
      # Fails closed: an unknown base or any git error counts as code. --no-renames makes a rename out of
      # src/ into docs/ show its deleted source path; -z reads raw file names, which git would otherwise quote.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          code=true
          files="$(mktemp)"
          if [ "$EVENT" = "pull_request" ] && [ -n "$BASE" ] \
            && git diff --no-renames --name-only -z "$BASE" "$HEAD_SHA" > "$files"; then
            code=false
            while IFS= read -r -d '' path; do
              case "$path" in
                # The module map is an executable input of the gate: its markdown generates the checked YAML.
                docs/module-map.md|docs/module-map.yaml) code=true; break ;;
                docs/*|*.md) ;;
                *) code=true; break ;;
              esac
            done < "$files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  check:
    name: typecheck · lint · test · lint:docs
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # ADR-0006 — CI runs the same compose Postgres as dev, not `services: postgres`,
      # so statement_timeout and lock_timeout match. Throwaway passwords, never secrets.
      - name: Local infra (Postgres 16 + Redis 7)
        run: |
          {
            echo "POSTGRES_OWNER_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_APP_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_AUTH_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_DISPATCHER_PASSWORD=$(openssl rand -hex 24)"
            echo "REDIS_PASSWORD=$(openssl rand -hex 24)"
          } > .env
          pnpm infra:up

      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # The gate order of plan v4 T12b / CLAUDE.md §10, one step each so a failure names its gate. RLS negative
      # suites and EXPLAIN assertions run inside the integration step (packages/db, apps/api queries/).
      - name: typecheck
        run: pnpm turbo run typecheck

      - name: lint (incl. max-lines and boundaries)
        run: pnpm turbo run lint

      - name: lint:docs
        run: pnpm lint:docs

      - name: cycles · module-map
        run: |
          node --test "scripts/module-map/*.test.mjs" "scripts/roadmap/*.test.mjs" "scripts/test-db/*.test.mjs"
          pnpm module-map:check

      # API domain specs run here via vitest.unit.config.ts with no Postgres, so a domain failure
      # stops CI before the integration shards. The default config still runs them inside the shards.
      - name: unit (domain)
        run: |
          pnpm turbo run test --filter=@pospay/domain
          pnpm --filter @pospay/api test:unit

      # apps/api, the slow suite, runs in the four `api-tests` shards below; every other package stays here.
      # turbo.json chains worker#test → api#test, so selecting the worker through turbo would run the whole api
      # suite again unsharded: the worker is excluded here and run directly by vitest in the next step.
      - name: Chromium headless shell (spec 056)
        run: pnpm --filter @pospay/documents exec node scripts/install-headless-shell.mjs --with-deps

      - name: integration · RLS negative · EXPLAIN (packages)
        run: pnpm turbo run test --filter=!@pospay/domain --filter=!@pospay/api --filter=!@pospay/worker

      - name: integration · worker
        run: |
          pnpm turbo run build --filter=@pospay/worker...
          pnpm --filter @pospay/worker exec vitest run

  full-check:
    name: pnpm check (full workspace)
    needs: [changes, check]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Local infra (Postgres 16 + Redis 7)
        run: |
          {
            echo "POSTGRES_OWNER_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_APP_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_AUTH_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_DISPATCHER_PASSWORD=$(openssl rand -hex 24)"
            echo "REDIS_PASSWORD=$(openssl rand -hex 24)"
          } > .env
          pnpm infra:up

      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-full-check-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-full-check-
            turbo-${{ runner.os }}-

      # the built-production smoke spec (files/production.spec.ts) starts dist/main.js of api AND worker
      - name: build api, worker and their dependencies
        run: pnpm turbo run build --filter=@pospay/api... --filter=@pospay/worker...

      - name: Chromium headless shell (spec 056)
        run: pnpm --filter @pospay/documents exec node scripts/install-headless-shell.mjs --with-deps

      - name: full workspace check
        run: pnpm check

  # apps/api integration · RLS negative · EXPLAIN, split into four parallel shards (vitest --shard): each shard brings
  # up its own compose Postgres (ADR-0006) and runs a quarter of the spec files. Public repo → free runners.
  # needs `check`: CLAUDE.md §10 orders the gates typecheck → lint → lint:docs → boundaries → cycles → module-map →
  # unit → integration, so the api integration shards start only after those gates are green.
  api-tests:
    name: api tests ${{ matrix.shard }}/4
    needs: [changes, check]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Local infra (Postgres 16 + Redis 7)
        run: |
          {
            echo "POSTGRES_OWNER_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_APP_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_AUTH_PASSWORD=$(openssl rand -hex 24)"
            echo "POSTGRES_DISPATCHER_PASSWORD=$(openssl rand -hex 24)"
            echo "REDIS_PASSWORD=$(openssl rand -hex 24)"
          } > .env
          pnpm infra:up

      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-api-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-api-${{ matrix.shard }}-
            turbo-${{ runner.os }}-

      # the built-production smoke spec (files/production.spec.ts) starts dist/main.js of api AND worker
      - name: build api, worker and their dependencies
        run: pnpm turbo run build --filter=@pospay/api... --filter=@pospay/worker...

      - name: api integration · RLS negative · EXPLAIN (shard ${{ matrix.shard }}/4)
        run: pnpm --filter @pospay/api exec vitest run --shard=${{ matrix.shard }}/4

  # CLAUDE.md §10 order ends with "… → integration → RLS negative tests → EXPLAIN checks → build all apps → docker
  # images": the full build runs after every integration job (packages, worker and the four api shards) is green.
  build:
    name: build all apps
    needs: [changes, check, api-tests]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-build-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-build-
            turbo-${{ runner.os }}-

      - name: build all apps
        run: pnpm turbo run build

  # CLAUDE.md §10 — images are built on every code change, and pushed to GHCR tagged by the commit SHA (never `latest`)
  # only from main. Plain docker CLI, no third-party action: the token below is the run's own, scoped to this repo.
  images:
    name: docker images
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      SHA: ${{ github.sha }}
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      STAGING_API_URL: https://api.staging.pospay.systems
      STAGING_POS_URL: https://pos.staging.pospay.systems
      PRODUCTION_POS_URL: https://pos.pospay.systems
    steps:
      - uses: actions/checkout@v7

      # Decoy env files are planted before the build, so the check below proves .dockerignore keeps them out — of the
      # build stage too, whose layers hold the whole context — rather than passing because none existed.
      - name: plant decoy env files
        run: |
          for file in .env .env.production apps/api/.env apps/api/.env.production apps/admin/.env apps/pos/.env packages/db/.env.local deploy/backup/backup.env; do
            echo "DECOY=never-in-an-image" > "$file"
          done

      - name: build api · migrate · worker · backup · admin · pos (and the build stage)
        run: |
          registry="$(echo "$REGISTRY" | tr '[:upper:]' '[:lower:]')"
          docker build -f deploy/Dockerfile.api --target build -t pospay-build-stage:check .
          docker build -f deploy/Dockerfile.api --target api -t "$registry/pospay-api:$SHA" .
          docker build -f deploy/Dockerfile.api --target migrate -t "$registry/pospay-migrate:$SHA" .
          docker build -f deploy/Dockerfile.worker -t "$registry/pospay-worker:$SHA" .
          docker build -f deploy/Dockerfile.backup -t "$registry/pospay-backup:$SHA" .
          docker build -f deploy/Dockerfile.admin --build-arg NEXT_PUBLIC_POS_URL="$PRODUCTION_POS_URL" -t "$registry/pospay-admin:$SHA" .
          docker build -f deploy/Dockerfile.pos -t "$registry/pospay-pos:$SHA" .
          # Staging variants: the API origin is baked into both front ends at build time.
          docker build -f deploy/Dockerfile.admin --build-arg NEXT_PUBLIC_API_URL="$STAGING_API_URL" --build-arg NEXT_PUBLIC_POS_URL="$STAGING_POS_URL" -t "$registry/pospay-admin-staging:$SHA" .
          docker build -f deploy/Dockerfile.pos --build-arg VITE_API_URL="$STAGING_API_URL" -t "$registry/pospay-pos-staging:$SHA" .
          echo "REGISTRY_LC=$registry" >> "$GITHUB_ENV"

      - name: no env file in any image or build stage
        run: |
          set -euo pipefail
          leaked=0
          images="pospay-build-stage:check $REGISTRY_LC/pospay-api:$SHA"
          images="$images $REGISTRY_LC/pospay-migrate:$SHA $REGISTRY_LC/pospay-worker:$SHA $REGISTRY_LC/pospay-backup:$SHA"
          images="$images $REGISTRY_LC/pospay-admin:$SHA"
          images="$images $REGISTRY_LC/pospay-pos:$SHA"
          images="$images $REGISTRY_LC/pospay-admin-staging:$SHA $REGISTRY_LC/pospay-pos-staging:$SHA"
          search='find / \( -name ".env" -o -name ".env.*" -o -name "*.env" \) ! -name "*.env.example" ! -name ".env.example" -not -path "/proc/*" 2>/dev/null; true'
          for image in $images; do
            # A failed inspection fails the step (set -e); it never counts as "nothing found".
            found="$(docker run --rm --entrypoint sh "$image" -c "$search")"
            if [ -n "$found" ]; then echo "::error::$image contains: $found"; leaked=1; fi
          done
          [ "$leaked" -eq 0 ]

      - name: push (main only)
        if: env.PUSH == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for image in api migrate worker backup admin pos admin-staging pos-staging; do docker push "$REGISTRY_LC/pospay-$image:$SHA"; done

  # The one check branch protection requires. Code changes need every job, including the full-workspace check;
  # docs-only changes need every heavy job skipped. Unknown classification and all other results fail.
  gate:
    name: ci-gate
    needs: [changes, check, full-check, api-tests, build, images]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CHECK: ${{ needs.check.result }}
          FULL_CHECK: ${{ needs.full-check.result }}
          API_TESTS: ${{ needs.api-tests.result }}
          BUILD: ${{ needs.build.result }}
          IMAGES: ${{ needs.images.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "changes=$CHANGES check=$CHECK full_check=$FULL_CHECK api_tests=$API_TESTS build=$BUILD images=$IMAGES code=$CODE"
          [ "$CHANGES" = "success" ] || exit 1
          if [ "$CODE" = "true" ]; then
            [ "$CHECK" = "success" ] && [ "$FULL_CHECK" = "success" ] && [ "$API_TESTS" = "success" ] && [ "$BUILD" = "success" ] && [ "$IMAGES" = "success" ]
          elif [ "$CODE" = "false" ]; then
            [ "$CHECK" = "skipped" ] && [ "$FULL_CHECK" = "skipped" ] && [ "$API_TESTS" = "skipped" ] && [ "$BUILD" = "skipped" ] && [ "$IMAGES" = "skipped" ]
          else
            echo "::error::Unknown code classification: $CODE"
            exit 1
          fi
