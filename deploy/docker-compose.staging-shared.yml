# PosPay staging on the server's shared Postgres 18 and Redis 8 (dokploy-network). Runs as the compose service
# `pospay-staging` of the Dokploy project "PosPay Staging" (Waleed, 2026-10-23). The environment lives in Dokploy
# (secrets included) and is never printed; deploy/staging.env.example lists its keys.
#
# The three public hosts are Dokploy domains (the service's Domains tab), not labels in this file: api.staging -> api:3000,
# app.staging -> admin:3000, pos.staging -> pos:8080, HTTPS with Let's Encrypt. Dokploy adds the Traefik labels on
# deploy, so adding labels here would create a second router for the same host.
#
# Every release and rollback uploads this file with each ${IMAGE_TAG:?} replaced by one SHA (pipeline skill §6, step 4
# and Restore); an old IMAGE_TAG line in the Dokploy environment is stale and never read. Rollback: upload this file
# pinned to the previous SHA. That restores the code, not the schema; it is safe only because every migration is
# expand/contract (CLAUDE.md §10).
#
# Accepted for staging (Waleed): Postgres 18 and Redis 8 here, where CI tests 16 and 7; and dokploy-network is shared
# with the server's other projects, which can reach the API's port directly (every protected route still needs a
# session or a device token; /health and /ready answer without one) and the shared database (password-protected). Production gets its own networks on the new server (D-11).

name: pospay-staging

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://pospay_app:${POSTGRES_APP_PASSWORD:?}@${DB_HOST:?}:5432/${DB_NAME:?}
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@${REDIS_HOST:?}:6379

x-staff-otp-env: &staff-otp-env
  STAFF_OTP_ENABLED: ${STAFF_OTP_ENABLED:-}
  STAFF_OTP_POS_ORIGIN: ${STAFF_OTP_POS_ORIGIN:-https://${POS_STAGING_HOST:?}}
  STAFF_OTP_DERIVATION_KEY: ${STAFF_OTP_DERIVATION_KEY:-}
  STAFF_OTP_DERIVATION_KEY_ID: ${STAFF_OTP_DERIVATION_KEY_ID:-}
  STAFF_OTP_DERIVATION_RETIRED_KEYS: ${STAFF_OTP_DERIVATION_RETIRED_KEYS:-}
  STAFF_OTP_VERIFICATION_KEY: ${STAFF_OTP_VERIFICATION_KEY:-}
  STAFF_OTP_VERIFICATION_KEY_ID: ${STAFF_OTP_VERIFICATION_KEY_ID:-}
  STAFF_OTP_VERIFICATION_RETIRED_KEYS: ${STAFF_OTP_VERIFICATION_RETIRED_KEYS:-}
  STAFF_OTP_TEMPLATES_APPROVED: ${STAFF_OTP_TEMPLATES_APPROVED:-}
  STAFF_OTP_TEMPLATE_AR: ${STAFF_OTP_TEMPLATE_AR:-}
  STAFF_OTP_TEMPLATE_EN: ${STAFF_OTP_TEMPLATE_EN:-}
  STAFF_OTP_COMPONENTS_AR: ${STAFF_OTP_COMPONENTS_AR:-}
  STAFF_OTP_COMPONENTS_EN: ${STAFF_OTP_COMPONENTS_EN:-}
  WHATSAPP_STOP_SUBSCRIPTION_CONFIRMED: ${WHATSAPP_STOP_SUBSCRIPTION_CONFIRMED:-}
  NOTIFICATIONS_MODE: ${NOTIFICATIONS_MODE:-}
  WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
  WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
  WHATSAPP_WABA_ID: ${WHATSAPP_WABA_ID:-}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
  NOTIFICATION_PHONE_HASH_KEY: ${NOTIFICATION_PHONE_HASH_KEY:-}
  NOTIFICATION_PHONE_HASH_KEY_ID: ${NOTIFICATION_PHONE_HASH_KEY_ID:-}
  NOTIFICATION_MESSAGE_ID_HASH_KEY: ${NOTIFICATION_MESSAGE_ID_HASH_KEY:-}
  PLATFORM_NOTIFICATIONS_DATABASE_URL: ${PLATFORM_NOTIFICATIONS_DATABASE_URL:-}
  WHATSAPP_GRAPH_API_VERSION: v23.0

services:
  # Migrations are their own step (CLAUDE.md §10): the apps start only after this exits 0.
  migrate:
    image: ${REGISTRY:-ghcr.io/lolotam}/pospay-migrate:${IMAGE_TAG:?}
    restart: 'no'
    environment:
      NODE_ENV: production
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?}
      POSTGRES_AUTH_PASSWORD: ${POSTGRES_AUTH_PASSWORD:?}
      POSTGRES_DISPATCHER_PASSWORD: ${POSTGRES_DISPATCHER_PASSWORD:?}
      POSTGRES_NOTIFICATIONS_PASSWORD: ${POSTGRES_NOTIFICATIONS_PASSWORD:-}
    networks: [dokploy-network]
    mem_limit: 256m

  api:
    image: ${REGISTRY:-ghcr.io/lolotam}/pospay-api:${IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      <<: [*app-env, *staff-otp-env]
      AUTH_DATABASE_URL: postgres://pospay_auth:${POSTGRES_AUTH_PASSWORD:?}@${DB_HOST:?}:5432/${DB_NAME:?}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      BETTER_AUTH_URL: https://${STAGING_HOST:?}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-https://${ADMIN_STAGING_HOST:?},https://${POS_STAGING_HOST:?}}
      PLATFORM_NOTIFICATIONS_DATABASE_URL: ${PLATFORM_NOTIFICATIONS_DATABASE_URL:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      WHATSAPP_WABA_ID: ${WHATSAPP_WABA_ID:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      NOTIFICATION_PHONE_HASH_KEY: ${NOTIFICATION_PHONE_HASH_KEY:-}
      NOTIFICATION_PHONE_HASH_KEY_ID: ${NOTIFICATION_PHONE_HASH_KEY_ID:-}
      NOTIFICATION_MESSAGE_ID_HASH_KEY: ${NOTIFICATION_MESSAGE_ID_HASH_KEY:-}
      WHATSAPP_STOP_BUTTON_ID: ${WHATSAPP_STOP_BUTTON_ID:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.staging.pospay.systems}
      # Private files on Cloudflare R2 (packages/storage); any of endpoint, bucket and the two keys missing = uploads answer STORAGE_NOT_CONFIGURED.
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [dokploy-network]
    mem_limit: 512m

  worker:
    image: ${REGISTRY:-ghcr.io/lolotam}/pospay-worker:${IMAGE_TAG:?}
    init: true
    stop_grace_period: 90s
    restart: unless-stopped
    environment:
      <<: [*app-env, *staff-otp-env]
      AUTH_DATABASE_URL: postgres://pospay_auth:${POSTGRES_AUTH_PASSWORD:?}@${DB_HOST:?}:5432/${DB_NAME:?}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-https://${ADMIN_STAGING_HOST:?},https://${POS_STAGING_HOST:?}}

      DISPATCHER_DATABASE_URL: postgres://pospay_dispatcher:${POSTGRES_DISPATCHER_PASSWORD:?}@${DB_HOST:?}:5432/${DB_NAME:?}
      # ADR-0019: OTP activation independent; tenant outbound remains separately closed.
      PLATFORM_NOTIFICATIONS_DATABASE_URL: ${PLATFORM_NOTIFICATIONS_DATABASE_URL:-}
      # Staff push (ADR-0052): production refuses fake mode, so an empty value is the default here; only `live` (staff OTP) or empty keep push enabled.
      NOTIFICATIONS_MODE: ${NOTIFICATIONS_MODE:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      NOTIFICATION_PHONE_HASH_KEY: ${NOTIFICATION_PHONE_HASH_KEY:-}
      NOTIFICATION_PHONE_HASH_KEY_ID: ${NOTIFICATION_PHONE_HASH_KEY_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_GRAPH_API_VERSION: v23.0
      # The worker retires replaced files and reads imports from the same bucket.
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [dokploy-network]
    mem_limit: 1g

  # The staging back-office and cashier. Both bake the API origin at build time, so CI builds staging variants with
  # https://api.staging.pospay.systems (pospay-admin-staging, pospay-pos-staging); the plain images are origin-less.
  # Hosts follow ADR-0001 §6: app.staging (back-office), pos.staging (cashier), api.staging (STAGING_HOST).
  admin:
    image: ${REGISTRY:-ghcr.io/lolotam}/pospay-admin-staging:${IMAGE_TAG:?}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    networks: [dokploy-network]
    mem_limit: 512m

  pos:
    image: ${REGISTRY:-ghcr.io/lolotam}/pospay-pos-staging:${IMAGE_TAG:?}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [dokploy-network]
    mem_limit: 128m

networks:
  dokploy-network:
    external: true
