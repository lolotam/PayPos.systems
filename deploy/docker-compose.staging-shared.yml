# Staging on the existing server's shared Postgres and Redis (plan T13-2, Waleed 2026-09-24): the "paypossystem"
# Dokploy project already runs Postgres 18 and Redis 8 on dokploy-network, so this file brings only the migrate step,
# the API and the worker, and joins that network. Deploy with deploy/staging-deploy.sh, never by hand: the server's
# .env (mode 600, generated on the server — never in Git) is interpolated here, so `docker compose config` WITHOUT -q
# prints every secret; the script only ever validates with -q.
#
# Rollback: redeploy the previous IMAGE_TAG. That restores the code, not the schema — it is safe only because every
# migration is expand/contract (CLAUDE.md §10), and T13-2 proves it by running the previous image on the new schema.
#
# Accepted for staging (Waleed): Postgres 18 and Redis 8 here, where CI tests 16 and 7 — the deploy's smoke test runs
# against them every time; and dokploy-network is shared with the server's other projects, which can reach the API's
# port directly (every route still needs a session or a device token) and the shared database (password-protected).
# Production gets its own networks on the new server (D-11).

name: pospay-staging

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://pospay_app:${POSTGRES_APP_PASSWORD:?}@${DB_HOST:?}:5432/${DB_NAME:?}
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@${REDIS_HOST:?}:6379

x-staff-otp-env: &staff-otp-env
  STAFF_OTP_ENABLED: ${STAFF_OTP_ENABLED:-}
  STAFF_OTP_POS_ORIGIN: ${STAFF_OTP_POS_ORIGIN:-}
  STAFF_OTP_DERIVATION_KEY: ${STAFF_OTP_DERIVATION_KEY:-}
  STAFF_OTP_DERIVATION_KEY_ID: ${STAFF_OTP_DERIVATION_KEY_ID:-}
  STAFF_OTP_DERIVATION_RETIRED_KEYS: ${STAFF_OTP_DERIVATION_RETIRED_KEYS:-}
  STAFF_OTP_VERIFICATION_KEY: ${STAFF_OTP_VERIFICATION_KEY:-}
  STAFF_OTP_VERIFICATION_KEY_ID: ${STAFF_OTP_VERIFICATION_KEY_ID:-}
  STAFF_OTP_VERIFICATION_RETIRED_KEYS: ${STAFF_OTP_VERIFICATION_RETIRED_KEYS:-}
  STAFF_OTP_TEMPLATES_APPROVED: ${STAFF_OTP_TEMPLATES_APPROVED:-}
  STAFF_OTP_TEMPLATE_AR: ${STAFF_OTP_TEMPLATE_AR:-}
  STAFF_OTP_TEMPLATE_EN: ${STAFF_OTP_TEMPLATE_EN:-}
  STAFF_OTP_COMPONENTS_AR: ${STAFF_OTP_COMPONENTS_AR:-}
  STAFF_OTP_COMPONENTS_EN: ${STAFF_OTP_COMPONENTS_EN:-}
  WHATSAPP_STOP_SUBSCRIPTION_CONFIRMED: ${WHATSAPP_STOP_SUBSCRIPTION_CONFIRMED:-}
  NOTIFICATIONS_MODE: ${NOTIFICATIONS_MODE:-}
  WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
  WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
  WHATSAPP_WABA_ID: ${WHATSAPP_WABA_ID:-}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
  NOTIFICATION_PHONE_HASH_KEY: ${NOTIFICATION_PHONE_HASH_KEY:-}
  NOTIFICATION_PHONE_HASH_KEY_ID: ${NOTIFICATION_PHONE_HASH_KEY_ID:-}
  NOTIFICATION_MESSAGE_ID_HASH_KEY: ${NOTIFICATION_MESSAGE_ID_HASH_KEY:-}
  PLATFORM_NOTIFICATIONS_DATABASE_URL: ${PLATFORM_NOTIFICATIONS_DATABASE_URL:-}
  WHATSAPP_GRAPH_API_VERSION: v23.0

services:
  # Migrations are their own step (CLAUDE.md §10): the apps start only after this exits 0.
  migrate:
    image: ${REGISTRY:-ghcr.io/lolotam}/pospay-migrate:${IMAGE_TAG:?}
    restart: 'no'
    environment:
      NODE_ENV: production
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?}
      POSTGRES_AUTH_PASSWORD: ${POSTGRES_AUTH_PASSWORD:?}
      POSTGRES_DISPATCHER_PASSWORD: ${POSTGRES_DISPATCHER_PASSWORD:?}
      POSTGRES_NOTIFICATIONS_PASSWORD: ${POSTGRES_NOTIFICATIONS_PASSWORD:-}
    networks: [dokploy-network]
    mem_limit: 256m

  api:
    image: ${REGISTRY:-ghcr.io/lolotam}/pospay-api:${IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      <<: [*app-env, *staff-otp-env]
      AUTH_DATABASE_URL: postgres://pospay_auth:${POSTGRES_AUTH_PASSWORD:?}@${DB_HOST:?}:5432/${DB_NAME:?}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      BETTER_AUTH_URL: https://${STAGING_HOST:?}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-https://${STAGING_HOST:?}}
      PLATFORM_NOTIFICATIONS_DATABASE_URL: ${PLATFORM_NOTIFICATIONS_DATABASE_URL:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      WHATSAPP_WABA_ID: ${WHATSAPP_WABA_ID:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      NOTIFICATION_PHONE_HASH_KEY: ${NOTIFICATION_PHONE_HASH_KEY:-}
      NOTIFICATION_PHONE_HASH_KEY_ID: ${NOTIFICATION_PHONE_HASH_KEY_ID:-}
      NOTIFICATION_MESSAGE_ID_HASH_KEY: ${NOTIFICATION_MESSAGE_ID_HASH_KEY:-}
      WHATSAPP_STOP_BUTTON_ID: ${WHATSAPP_STOP_BUTTON_ID:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      COOKIE_DOMAIN: .${STAGING_HOST:?}
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [dokploy-network]
    labels:
      traefik.enable: 'true'
      traefik.docker.network: dokploy-network
      traefik.http.routers.pospay-staging-api.rule: Host(`${STAGING_HOST:?}`)
      traefik.http.routers.pospay-staging-api.entrypoints: websecure
      traefik.http.routers.pospay-staging-api.tls.certresolver: letsencrypt
      traefik.http.routers.pospay-staging-api-http.rule: Host(`${STAGING_HOST:?}`)
      traefik.http.routers.pospay-staging-api-http.entrypoints: web
      traefik.http.routers.pospay-staging-api-http.middlewares: redirect-to-https@file
      traefik.http.services.pospay-staging-api.loadbalancer.server.port: '3000'
    mem_limit: 512m

  worker:
    image: ${REGISTRY:-ghcr.io/lolotam}/pospay-worker:${IMAGE_TAG:?}
    restart: unless-stopped
    environment:
      <<: [*app-env, *staff-otp-env]
      AUTH_DATABASE_URL: postgres://pospay_auth:${POSTGRES_AUTH_PASSWORD:?}@${DB_HOST:?}:5432/${DB_NAME:?}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-}

      DISPATCHER_DATABASE_URL: postgres://pospay_dispatcher:${POSTGRES_DISPATCHER_PASSWORD:?}@${DB_HOST:?}:5432/${DB_NAME:?}
      # ADR-0019: OTP activation independent; tenant outbound remains separately closed.
      PLATFORM_NOTIFICATIONS_DATABASE_URL: ${PLATFORM_NOTIFICATIONS_DATABASE_URL:-}
      NOTIFICATIONS_MODE: ${NOTIFICATIONS_MODE:-fake}
      NOTIFICATION_PHONE_HASH_KEY: ${NOTIFICATION_PHONE_HASH_KEY:-}
      NOTIFICATION_PHONE_HASH_KEY_ID: ${NOTIFICATION_PHONE_HASH_KEY_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_GRAPH_API_VERSION: v23.0
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [dokploy-network]
    mem_limit: 384m

networks:
  dokploy-network:
    external: true
