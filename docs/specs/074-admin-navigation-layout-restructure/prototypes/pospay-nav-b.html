<title>PosPay Nav B</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: one app frame (a size container) holding a navigation shell and a page column;
   every responsive rule is a container query, so the Desktop / Tablet / Phone preview and a real
   small screen take the same path. Tokens are Souk Tiles, copied from packages/ui/src/styles/theme.css. */
:root {
  --radius: 1.375rem;
  --r-ctl: calc(var(--radius) - 2px);
  --r-card: var(--radius);
  --background: oklch(0.962 0.007 174.4);
  --foreground: oklch(0.244 0.029 227.2);
  --card: oklch(1 0 0);
  --popover: oklch(1 0 0);
  --primary: oklch(0.502 0.084 188.3);
  --primary-foreground: oklch(1 0 0);
  --secondary: oklch(0.933 0.013 179.5);
  --muted: oklch(0.945 0.01 174.3);
  --muted-foreground: oklch(0.475 0.026 218);
  --accent: oklch(0.941 0.033 51.2);
  --accent-foreground: oklch(0.4 0.12 40.6);
  --destructive: oklch(0.503 0.18 22.9);
  --destructive-foreground: oklch(1 0 0);
  --success: oklch(0.477 0.08 187.9);
  --success-soft: oklch(0.933 0.023 183.2);
  --warning-soft: oklch(0.945 0.045 84.6);
  --border: oklch(0.898 0.016 177);
  --input: oklch(0.614 0.027 183.7);
  --ring: oklch(0.601 0.179 41);
  --info: oklch(0.52 0.073 251.1);
  --sidebar: oklch(1 0 0);
  --cta: oklch(0.679 0.184 42.5);
  --cta-foreground: oklch(0.223 0.037 252.7);
  --tile-navy: oklch(0.223 0.037 252.7);
  --tile-navy-foreground: oklch(0.983 0.006 84.6);
  --tile-sand: oklch(0.957 0.027 78.2);
  --status-foreground: oklch(0.962 0.007 174.4);
  --scrim: oklch(0 0 0 / 0.4);
  --stage: oklch(0.9 0.012 190);
  --font-sans: 'Readex Pro', system-ui, sans-serif;
  --font-display: 'Baloo Bhaijaan 2', 'Readex Pro', system-ui, sans-serif;
  --t-fast: 150ms;
  --t-base: 200ms;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --gut-s: max(16px, env(safe-area-inset-left, 0px));
  --gut-e: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    --background: oklch(0.194 0.019 208.2);
    --foreground: oklch(0.957 0.01 181.4);
    --card: oklch(0.253 0.028 211.3);
    --popover: oklch(0.29 0.034 208);
    --primary: oklch(0.735 0.113 186.2);
    --primary-foreground: oklch(0.222 0.033 188.3);
    --secondary: oklch(0.308 0.035 204.3);
    --muted: oklch(0.275 0.03 206);
    --muted-foreground: oklch(0.751 0.026 184);
    --accent: oklch(0.29 0.06 47.1);
    --accent-foreground: oklch(0.876 0.076 52.9);
    --destructive: oklch(0.715 0.144 16.1);
    --destructive-foreground: oklch(0.194 0.019 208.2);
    --success: oklch(0.811 0.098 186.4);
    --success-soft: oklch(0.303 0.041 197.7);
    --warning-soft: oklch(0.302 0.047 82.6);
    --border: oklch(0.347 0.037 192.9);
    --input: oklch(0.545 0.039 202.9);
    --ring: oklch(0.711 0.166 44.4);
    --info: oklch(0.745 0.064 250.9);
    --sidebar: oklch(0.222 0.023 210.1);
    --tile-navy: oklch(0.308 0.049 252.8);
    --tile-sand: oklch(0.284 0.014 95.5);
    --status-foreground: oklch(0.194 0.019 208.2);
    --scrim: oklch(0 0 0 / 0.6);
    --stage: oklch(0.15 0.015 208);
    color-scheme: dark;
  }
}
:root[data-theme='dark'] {
  --background: oklch(0.194 0.019 208.2);
  --foreground: oklch(0.957 0.01 181.4);
  --card: oklch(0.253 0.028 211.3);
  --popover: oklch(0.29 0.034 208);
  --primary: oklch(0.735 0.113 186.2);
  --primary-foreground: oklch(0.222 0.033 188.3);
  --secondary: oklch(0.308 0.035 204.3);
  --muted: oklch(0.275 0.03 206);
  --muted-foreground: oklch(0.751 0.026 184);
  --accent: oklch(0.29 0.06 47.1);
  --accent-foreground: oklch(0.876 0.076 52.9);
  --destructive: oklch(0.715 0.144 16.1);
  --destructive-foreground: oklch(0.194 0.019 208.2);
  --success: oklch(0.811 0.098 186.4);
  --success-soft: oklch(0.303 0.041 197.7);
  --warning-soft: oklch(0.302 0.047 82.6);
  --border: oklch(0.347 0.037 192.9);
  --input: oklch(0.545 0.039 202.9);
  --ring: oklch(0.711 0.166 44.4);
  --info: oklch(0.745 0.064 250.9);
  --sidebar: oklch(0.222 0.023 210.1);
  --tile-navy: oklch(0.308 0.049 252.8);
  --tile-sand: oklch(0.284 0.014 95.5);
  --status-foreground: oklch(0.194 0.019 208.2);
  --scrim: oklch(0 0 0 / 0.6);
  --stage: oklch(0.15 0.015 208);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--stage);
  color: var(--foreground);
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.5;
  font-variant-numeric: tabular-nums;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: 0; text-wrap: balance; margin: 0; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
.num { direction: ltr; unicode-bidi: isolate; }
svg.i { width: 1rem; height: 1rem; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
[dir='rtl'] svg.i.flip { transform: scaleX(-1); }

/* ---------- prototype bar (not part of the product) ---------- */
.pbar {
  flex: none;
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
  padding-block: 8px; padding-left: var(--gut-s); padding-right: var(--gut-e);
  background: var(--tile-navy); color: var(--tile-navy-foreground);
  font-size: 13px;
}
.pbar b { font-family: var(--font-display); font-size: 16px; }
.pbar .sp { flex: 1; min-width: 8px; }
.seg { display: inline-flex; padding: 2px; border-radius: 999px; background: oklch(1 0 0 / 0.12); }
.seg button {
  border: 0; background: transparent; color: inherit; cursor: pointer;
  min-height: 32px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 500;
  transition: background var(--t-fast);
}
.seg button[aria-pressed='true'] { background: var(--cta); color: var(--cta-foreground); font-weight: 600; }
.stage { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: stretch; }
.stage[data-device='tablet'], .stage[data-device='phone'] { padding: 16px; }

/* ---------- app frame ---------- */
.app {
  container: app / inline-size;
  position: relative; overflow: hidden;
  width: 100%; height: 100%;
  background: var(--background);
  transition: width var(--t-base) var(--ease), border-radius var(--t-base);
}
.stage[data-device='tablet'] .app { width: 820px; max-width: 100%; border-radius: 22px; box-shadow: 0 0 0 1px var(--border); }
.stage[data-device='phone'] .app { width: 390px; max-width: 100%; max-height: 800px; align-self: center; border-radius: 28px; box-shadow: 0 0 0 1px var(--border); }
.shell { position: absolute; inset: 0; display: flex; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.page { max-width: 1200px; margin-inline: auto; padding: 24px; display: flex; flex-direction: column; gap: 24px; }
.page.narrow { max-width: 840px; }
@container app (max-width: 767px) { .page { padding: 16px; gap: 16px; } }
.page > * { animation: rise var(--t-base) var(--ease) both; }
.page > *:nth-child(2) { animation-delay: 40ms; }
.page > *:nth-child(3) { animation-delay: 80ms; }
.page > *:nth-child(n + 4) { animation-delay: 120ms; }
/* transform only: a stalled animation (thumbnail, background tab) must never leave the page invisible */
@keyframes rise { from { transform: translateY(8px); } }
@keyframes fade { from { opacity: 0; } }
@keyframes slide-s { from { transform: translateX(-100%); } }
@keyframes slide-e { from { transform: translateX(100%); } }
@keyframes sheet { from { transform: translateY(100%); } }
@keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(0.98); } }

/* ---------- primitives (packages/ui) ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap;
  min-height: 48px; padding: 8px 16px; border: 0; border-radius: var(--r-ctl);
  font-size: 15px; font-weight: 600; cursor: pointer; text-decoration: none;
  background: var(--cta); color: var(--cta-foreground);
  transition: background var(--t-fast), color var(--t-fast);
}
.btn:hover { background: color-mix(in oklch, var(--cta) 90%, transparent); }
.btn.sm { min-height: 44px; padding: 8px 12px; }
.btn.icon { width: 44px; min-height: 44px; padding: 0; }
.btn.secondary { background: var(--secondary); color: var(--foreground); }
.btn.secondary:hover { background: color-mix(in oklch, var(--secondary) 80%, transparent); }
.btn.outline { background: var(--background); color: var(--foreground); box-shadow: inset 0 0 0 1px var(--input); }
.btn.ghost { background: transparent; color: var(--foreground); }
.btn.outline:hover, .btn.ghost:hover { background: var(--accent); color: var(--accent-foreground); }
.btn.destructive { background: var(--destructive); color: var(--destructive-foreground); }
.btn.link { background: transparent; color: var(--primary); min-height: 0; padding: 0; }
.btn.link:hover { text-decoration: underline; text-underline-offset: 4px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-card); min-width: 0; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 999px; border: 1px solid transparent; font-size: 12px; font-weight: 500; white-space: nowrap; }
.badge.neutral { background: var(--secondary); border-color: var(--border); }
.badge.success { background: var(--success); color: var(--status-foreground); }
.badge.warning { background: var(--accent-foreground); color: var(--status-foreground); }
.badge.danger { background: var(--destructive); color: var(--status-foreground); }
.badge.info { background: var(--info); color: var(--status-foreground); }
.badge.brand { background: var(--primary); color: var(--primary-foreground); }
.count { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--cta); color: var(--cta-foreground); font-size: 11px; font-weight: 600; display: inline-grid; place-items: center; }
.field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.field label { font-size: 14px; font-weight: 500; }
.field small { color: var(--muted-foreground); font-size: 13px; }
.input {
  min-height: 48px; width: 100%; padding: 8px 12px; border-radius: var(--r-ctl);
  border: 1px solid var(--input); background: var(--card); font-size: 16px; text-align: start;
}
textarea.input { min-height: 96px; resize: vertical; }
.input::placeholder { color: var(--muted-foreground); }
.check { display: flex; align-items: center; gap: 8px; min-height: 44px; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--primary); }

/* page header: title + description, one primary action at the inline end */
.phead { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px 16px; }
.phead .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.phead h1 { font-size: 24px; line-height: 1.25; }
.phead .tx p { font-size: 14px; color: var(--muted-foreground); max-width: 65ch; }
.phead .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-inline-start: auto; }
@container app (max-width: 479px) { .phead .acts { width: 100%; } .phead .acts .btn { flex: 1; } }

/* stats */
.stats { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.stat { padding: 24px; display: flex; flex-direction: column; gap: 8px; }
.stat .l { font-size: 14px; font-weight: 500; color: var(--muted-foreground); }
.stat .v { font-size: 24px; font-weight: 700; }
.stat .d { font-size: 13px; color: var(--muted-foreground); }
.stat.teal { background: var(--primary); color: var(--primary-foreground); border-color: transparent; }
.stat.navy { background: var(--tile-navy); color: var(--tile-navy-foreground); border-color: transparent; }
.stat.sand { background: var(--tile-sand); border-color: transparent; }
.stat.teal .l, .stat.navy .l, .stat.teal .d, .stat.navy .d { color: inherit; opacity: 0.85; }
@container app (max-width: 479px) { .stats { grid-template-columns: 1fr 1fr; gap: 12px; } .stat { padding: 16px; } .stat .v { font-size: 20px; } }

/* table frame: title bar, filter bar, table, footer */
.tframe { overflow: hidden; }
.tbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 16px; border-bottom: 1px solid var(--border); }
.tbar h2 { font-size: 16px; }
.tbar .acts { margin-inline-start: auto; display: flex; flex-wrap: wrap; gap: 8px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--muted); }
.filters .input { width: auto; flex: 1 1 160px; font-size: 14px; }
.filters .input.search { flex: 2 1 220px; }
.twrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; text-align: start; font-size: 14px; }
thead { background: var(--secondary); }
th { padding: 12px 16px; text-align: start; font-size: 12px; font-weight: 500; color: var(--muted-foreground); white-space: nowrap; }
td { padding: 12px 16px; text-align: start; white-space: nowrap; }
tbody tr { border-top: 1px solid var(--border); transition: background var(--t-fast); }
tbody tr:hover { background: var(--muted); }
td.strong { font-weight: 600; }
td .btn.sm { font-size: 13px; }
.tfoot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); font-size: 13px; color: var(--muted-foreground); }
.tfoot .acts { margin-inline-start: auto; display: flex; gap: 8px; }
/* phone: rows become stacked cards, first column is the card title */
@container app (max-width: 599px) {
  .tframe.stack thead { display: none; }
  .tframe.stack table, .tframe.stack tbody, .tframe.stack tr, .tframe.stack td { display: block; }
  .tframe.stack tr { padding: 12px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
  .tframe.stack td { padding: 0; white-space: normal; min-width: 0; }
  .tframe.stack td::before { content: attr(data-l); display: block; font-size: 11px; color: var(--muted-foreground); }
  .tframe.stack td:first-child { grid-column: 1 / -1; font-weight: 600; font-size: 15px; }
  .tframe.stack td:first-child::before { display: none; }
}

/* form: sections of a 12-col grid; fields span 12 / 6 / 4 */
.form { display: flex; flex-direction: column; }
.fsec { padding: 24px; display: grid; gap: 16px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.fsec + .fsec { border-top: 1px solid var(--border); }
.fsec > h2 { grid-column: 1 / -1; font-size: 16px; }
.fsec > p { grid-column: 1 / -1; font-size: 14px; color: var(--muted-foreground); margin-top: -8px; }
.fsec .field, .fsec .check { grid-column: span 6; }
.fsec .s12 { grid-column: 1 / -1; }
.fsec .s4 { grid-column: span 4; }
@container app (max-width: 767px) { .fsec { padding: 16px; } .fsec .field, .fsec .check, .fsec .s4 { grid-column: 1 / -1; } }
.fbar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; padding: 16px 24px; border-top: 1px solid var(--border); background: var(--muted); border-end-start-radius: var(--r-card); border-end-end-radius: var(--r-card); }
@container app (max-width: 767px) { .fbar { padding: 16px; } .fbar .btn { flex: 1; } }

/* two-column page: main + side (8 / 4) */
.split { display: grid; gap: 24px; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); align-items: stretch; }
@container app (max-width: 1023px) { .split { grid-template-columns: minmax(0, 1fr); gap: 16px; } }
.col { display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.panel { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
.panel h2 { font-size: 16px; }
.panel > p { font-size: 14px; color: var(--muted-foreground); }
@container app (max-width: 767px) { .panel { padding: 16px; } }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; }
.kv div { min-width: 0; }
.kv dt, .kv .k { font-size: 12px; color: var(--muted-foreground); }
.kv dd, .kv .v { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
.list { display: flex; flex-direction: column; }
.list .li { display: flex; align-items: center; gap: 12px; padding: 12px 0; min-height: 56px; }
.list .li + .li { border-top: 1px solid var(--border); }
.list .li .tx { flex: 1; min-width: 0; }
.list .li .tx b { display: block; font-weight: 600; font-size: 14px; }
.list .li .tx span { font-size: 13px; color: var(--muted-foreground); }
.av { width: 40px; height: 40px; border-radius: 999px; background: var(--secondary); display: grid; place-items: center; font-weight: 600; font-size: 14px; flex: none; }
.note { padding: 12px 16px; border-radius: var(--r-ctl); background: var(--warning-soft); font-size: 14px; display: flex; gap: 8px; align-items: flex-start; }
.note.info { background: var(--success-soft); }
.empty { padding: 32px 24px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
.empty .ic { width: 48px; height: 48px; border-radius: var(--r-ctl); background: var(--secondary); display: grid; place-items: center; color: var(--muted-foreground); }
.empty h2 { font-size: 18px; }
.empty p { color: var(--muted-foreground); max-width: 48ch; }

/* board (kanban-like columns, e.g. attendance) */
.board { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); align-items: start; }
.bcol { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.bcol h2 { font-size: 15px; display: flex; align-items: center; gap: 8px; }
.bcard { padding: 12px; border-radius: var(--r-ctl); background: var(--muted); display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
.bcard b { font-weight: 600; }
.bcard span { font-size: 13px; color: var(--muted-foreground); }

/* week grid (schedules) */
.week { display: grid; grid-template-columns: 140px repeat(7, minmax(84px, 1fr)); font-size: 13px; min-width: 760px; }
.week > div { padding: 6px 8px; display: flex; align-items: center; border-top: 1px solid var(--border); border-inline-start: 1px solid var(--border); min-height: 52px; }
.week > .h { background: var(--secondary); font-size: 12px; color: var(--muted-foreground); border-top: 0; min-height: 0; }
.week > .n { font-weight: 600; border-inline-start: 0; }
.week .sh { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--success-soft); font-size: 12px; }
.week .off { color: var(--muted-foreground); }

/* in-page tabs (underline) and sub-tabs (pills) */
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--border); position: relative; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a {
  position: relative; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  min-height: 48px; padding: 0 16px; font-size: 14px; font-weight: 500; color: var(--muted-foreground); text-decoration: none;
  transition: color var(--t-fast);
}
.tabs a:hover { color: var(--foreground); }
.tabs a[aria-current='page'] { color: var(--foreground); font-weight: 600; }
.tabs a::after { content: ''; position: absolute; inset-inline: 12px; bottom: -1px; height: 3px; border-radius: 3px 3px 0 0; background: var(--cta); transform: scaleX(0); transition: transform var(--t-base) var(--ease); }
.tabs a[aria-current='page']::after { transform: scaleX(1); }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pills a { min-height: 44px; padding: 0 14px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; text-decoration: none; color: var(--foreground); background: var(--secondary); transition: background var(--t-fast), color var(--t-fast); }
.pills a[aria-current='page'] { background: var(--primary); color: var(--primary-foreground); }
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--muted-foreground); }
.crumbs a { color: inherit; text-decoration: none; }
.crumbs a:hover { color: var(--primary); text-decoration: underline; }
.crumbs b { color: var(--foreground); font-weight: 500; }

/* overlays */
.scrim { position: absolute; inset: 0; z-index: 40; background: var(--scrim); animation: fade var(--t-base); }

    ${p.list ? `<div class="list">${p.list.map(([t, s, go]) => `<${go ? `a href="#${go}"` : 'div'} class="li">${go ? '' : `<span class="av">${E(t).slice(0, 1)}</span>`}<span class="tx"><b>${E(t)}</b>${/^\d+$/.test(s) ? '' : `<span>${E(s)}</span>`}</span>${/^\d+$/.test(s) ? badgeN(s) : ''}${go ? I('chev') : ''}</${go ? 'a' : 'div'}>`).join('')}</div>` : ''}
    ${p.acts ? `<div class="pacts">${p.acts.map((a) => btn(a)).join('')}</div>` : ''}</div>`,
  steps: (st) => `<ol class="card steps">${st.map(([t, d, a], i) => `<li><span class="sn num">${i + 1}</span><div class="tx"><b>${E(t)}</b><span>${E(d)}</span></div>${a ? btn(a, true) : ''}</li>`).join('')}</ol>`,
  board: (cols) => `<div class="board">${cols.map((c) => `<div class="card bcol"><h2>${E(c.t)} ${badgeN(c.n)}</h2>${c.cards.map(([t, s]) => `<div class="bcard"><b>${E(t)}</b><span>${E(s)}</span></div>`).join('')}</div>`).join('')}</div>`,
  week(w) {
    const days = ['Sat|السبت', 'Sun|الأحد', 'Mon|الاثنين', 'Tue|الثلاثاء', 'Wed|الأربعاء', 'Thu|الخميس', 'Fri|الجمعة'];
    return `<div class="card tframe"><div class="filters"><input class="input" type="date" value="${w.start}" aria-label="${T('Week starts (Saturday)|بداية الأسبوع (السبت)')}"><span class="check">${T('Tap a cell to edit that day.|اضغط الخلية لتعديل اليوم.')}</span></div>
      <div class="twrap"><div class="week"><div class="h n">${T('Employee|الموظف')}</div>${days.map((d, i) => `<div class="h">${E(d)} <span class="num">${21 + i}</span></div>`).join('')}
      ${w.rows.map((r) => `<div class="n">${E(r[0])}</div>${r.slice(1).map((c) => `<div>${c ? `<button class="sh num" data-toast>${c}</button>` : `<span class="off">${T('No shifts|بلا ورديات')}</span>`}</div>`).join('')}`).join('')}</div></div>
      <div class="tfoot"><span>${T('4 employees attached this week|4 موظفات مرتبطات هذا الأسبوع')}</span></div></div>`;
  },
  subtabs(tabs, pid) {
    const cur = S.sub[pid] || 0;
    return `<div class="tabs sub" role="tablist">${tabs.map((t, i) => `<a href="#" role="tab" data-st="${i}" ${i === cur ? 'aria-current="page"' : ''}>${E(t.t)} ${badgeN(t.count)}</a>`).join('')}</div><div class="col subpane">${blocks(tabs[cur].blocks, pid)}</div>`;
  },
  hub: (ids) => `<div class="hub">${ids.map((id) => `<a class="card hubc" href="#${id}"><span class="hi">${I(PICON[id])}</span><span class="tx"><b>${E(PAGES[id].title)} ${badgeN(COUNTS[id])}</b><span>${E(PAGES[id].desc || '')}</span></span>${I('chev')}</a>`).join('')}</div>`,
  note: (t, _p, tone) => `<div class="note ${tone || ''}">${I('alert')}<span>${E(t)}</span></div>`,
};
const blocks = (list, pid) => list.map(([k, a, b]) => BLOCK[k](a, pid, b)).join('');

function pageHTML(id, o = {}) {
  const p = PAGES[id];
  const acts = (p.actions || []).map((a) => btn(a)).join('');
  return `<div class="page ${p.narrow && !o.wide ? 'narrow' : ''}">${o.top || ''}
    <header class="phead"><div class="tx"><h1>${E(p.title)}</h1>${p.desc ? `<p>${E(p.desc)}</p>` : ''}</div>${acts ? `<div class="acts">${acts}</div>` : ''}</header>
    ${o.mid || ''}${blocks(p.blocks, id)}</div>`;
}
const crumbs = (parts) => `<nav class="crumbs" aria-label="breadcrumb">${parts.map(([l, go], i) => (i === parts.length - 1 ? `<b>${E(l)}</b>` : `${go ? `<a href="#${go}">${E(l)}</a>` : `<span>${E(l)}</span>`}${I('chev')}`)).join('')}</nav>`;
const root = (id) => (PAGES[id] && PAGES[id].parent) || id;

/* ---------- shared chrome pieces ---------- */
const WS = { company: 'Lulwa Group|مجموعة لولوة', business: 'Glow Salon|صالون جلو', branch: 'Salmiya|السالمية' };
const brand = (small) => `<a class="brand" href="#home" aria-label="PosPay"><span class="bm">P</span>${small ? '' : '<span class="bw">PosPay</span>'}</a>`;
const wsBtn = (mode) => `<button type="button" class="wsb ${mode || ''}" data-pop="ws" aria-haspopup="dialog">${I('building')}<span class="tx"><b>${E(WS.business)}</b><span>${E(WS.branch)}</span></span>${I('down')}</button>`;
const utils = () => `<button type="button" class="btn ghost icon" data-pop="notif" aria-label="${T('Notifications|الإشعارات')}"><span class="dotw">${I('bell')}<i></i></span></button>
  <button type="button" class="btn outline sm loc" data-lang="${S.lang === 'ar' ? 'en' : 'ar'}">${S.lang === 'ar' ? 'English' : 'العربية'}</button>
  <button type="button" class="avb" data-pop="acct" aria-label="${T('Account|الحساب')}">W</button>`;
const POPS = {
  ws: () => `<h2>${T('Where you are working|أين تعمل الآن')}</h2>
    ${[['Company|الشركة', [WS.company]], ['Business|النشاط', [WS.business, 'Glow Spa|سبا جلو']], ['Branch|الفرع', BRANCHES]].map(([l, o], i) => `<div class="field"><label for="ws${i}">${E(l)}</label><select class="input" id="ws${i}">${o.map((x) => `<option>${E(x)}</option>`).join('')}</select></div>`).join('')}
    <p class="hint">${T('Attendance, leave and alerts pages follow this branch.|صفحات الحضور والإجازات والتنبيهات تتبع هذا الفرع.')}</p>`,
  notif: () => `<h2>${T('Notifications|الإشعارات')}</h2><div class="list">
    <a class="li" href="#leave-approvals"><span class="tx"><b>${T('Sara asked for annual leave|سارة طلبت إجازة سنوية')}</b><span>${T('1–5 December · 8 min ago|1–5 ديسمبر · قبل 8 دقائق')}</span></span></a>
    <a class="li" href="#att-exceptions"><span class="tx"><b>${T('Dalal clocked in 16 minutes late|دلال سجلت دخولًا متأخرًا 16 دقيقة')}</b><span>${T('Salmiya · 09:31|السالمية · 09:31')}</span></span></a>
    <a class="li" href="#employee"><span class="tx"><b>${T('Health card expires in 15 days|البطاقة الصحية تنتهي خلال 15 يومًا')}</b><span>${T('Sara Al-Enezi|سارة العنزي')}</span></span></a></div>
    <button class="btn sm outline" data-toast>${T('Mark all read|تعليم الكل كمقروء')}</button>`,
  acct: () => `<div class="who"><span class="av">W</span><span class="tx"><b>Waleed M.</b><span>owner@glow.example</span></span></div>
    <div class="list"><a class="li" href="#security">${I('shield')}<span class="tx"><b>${T('Authenticator|المصادقة')}</b></span></a></div>
    <div class="seg thm">${[['light', 'Light|فاتح'], ['dark', 'Dark|داكن'], ['', 'System|النظام']].map(([v, l]) => `<button data-theme="${v}" aria-pressed="${(document.documentElement.dataset.theme || '') === v}">${E(l)}</button>`).join('')}</div>
    <button class="btn sm outline" data-toast>${I('logout')}${T('Sign out|تسجيل الخروج')}</button>`,
};
function closePop() { $$('.pop, .scrim.p').forEach((e) => e.remove()); }
function openPop(kind, anchor, html) {
  const app = $('#app'); closePop();
  const r = anchor.getBoundingClientRect(), a = app.getBoundingClientRect();
  const scrim = document.createElement('div'); scrim.className = 'scrim p'; scrim.onclick = closePop;
  const pop = document.createElement('div'); pop.className = `pop card ${kind}`; pop.setAttribute('role', 'dialog');
  pop.innerHTML = html || POPS[kind]();
  pop.style.top = `${Math.min(r.bottom - a.top + 8, a.height - 120)}px`;
  if (r.left + r.width / 2 > a.left + a.width / 2) pop.style.right = `${Math.max(8, a.right - r.right)}px`; else pop.style.left = `${Math.max(8, r.left - a.left)}px`;
  app.append(scrim, pop);
  const f = pop.querySelector('select, a, button, input'); if (f) f.focus({ preventScroll: true });
}
function toast(msg) {
  $$('.toast').forEach((e) => e.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = msg;
  $('#app').append(t); setTimeout(() => t.remove(), 2200);
}

/* ---------- boot ---------- */
const route = () => { const h = location.hash.slice(1); return PAGES[h] ? h : 'home'; };
function paint(full) {
  const d = document.documentElement; d.lang = S.lang; d.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
  $$('.pbar [data-lang]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === S.lang));
  $$('.pbar [data-device]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.device === S.device));
  $('.stage').dataset.device = S.device;
  if (full) Shell.mount($('#app'));
  closePop(); Shell.update(route());
  const sc = $('#app .scroll'); if (sc) sc.scrollTop = 0;
}
function boot() {
  try { S.lang = localStorage.getItem('pp-lang') || S.lang; } catch (e) { /* storage may be blocked */ }
  if (window.innerWidth < 700) S.device = 'desktop';
  document.body.insertAdjacentHTML('afterbegin', `<div class="pbar"><b>${Shell.letter}</b><span>${Shell.name}</span><span class="sp"></span>
    <div class="seg dev" role="group" aria-label="Device">${[['desktop', 'Desktop'], ['tablet', 'Tablet'], ['phone', 'Phone']].map(([v, l]) => `<button data-device="${v}">${l}</button>`).join('')}</div>
    <div class="seg" role="group" aria-label="Language"><button data-lang="ar">العربية</button><button data-lang="en">English</button></div></div>
    <div class="stage"><div class="app" id="app"></div></div>`);
  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-lang],[data-device],[data-theme],[data-pop],[data-go],[data-st],[data-toast],[data-act]');
    if (!t) return;
    if (t.dataset.lang) { S.lang = t.dataset.lang; try { localStorage.setItem('pp-lang', S.lang); } catch (x) { /* ignore */ } return paint(true); }
    if (t.dataset.device) { S.device = t.dataset.device; return paint(true); }
    if (t.dataset.theme != null && t.closest('.thm')) { const d = document.documentElement; if (t.dataset.theme) d.dataset.theme = t.dataset.theme; else delete d.dataset.theme; return closePop(); }
    if (t.dataset.pop) return openPop(t.dataset.pop, t);
    if (t.dataset.go) { location.hash = t.dataset.go; return; }
    if (t.dataset.st != null) { e.preventDefault(); S.sub[route()] = +t.dataset.st; return Shell.update(route()); }
    if (t.dataset.act) { e.preventDefault(); return Shell.act(t.dataset.act, t); }
    if (t.hasAttribute('data-toast')) { e.preventDefault(); toast(`${T('Prototype only|نموذج فقط')} · ${t.textContent.trim()}`); }
  });
  document.addEventListener('click', (e) => { const l = e.target.closest('a[href^="#"]'); if (l && l.getAttribute('href').slice(1) === location.hash.slice(1)) { closePop(); if (Shell.act) Shell.act('esc'); } });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closePop(); if (Shell.act) Shell.act('esc'); } if (Shell.key) Shell.key(e); });
  window.addEventListener('hashchange', () => paint(false));
  paint(true);
}

/* Prototype B — task-based top bar with mega menus, a hub page per module, local nav beside the page. */
const NAV = [
  { id: 'today', l: 'Today|اليوم', i: 'home', page: 'home' },
  { id: 'sell', l: 'Sell|البيع', i: 'receipt', d: 'Record what customers buy and review the day.|سجّل مشتريات العملاء وراجع اليوم.', cols: [{ h: 'Record|تسجيل', ids: ['visit', 'pkgsale'] }, { h: 'Review|مراجعة', ids: ['day'] }] },
  { id: 'approvals', l: 'Approvals|الاعتمادات', i: 'inbox', d: 'Everything waiting for your decision, in one place.|كل ما ينتظر قرارك في مكان واحد.', cols: [{ h: 'Waiting for a decision|بانتظار القرار', ids: ['leave-approvals', 'att-requests', 'att-exceptions'] }] },
  { id: 'people', l: 'People|الأفراد', i: 'users', d: 'Records, working time and reports for your team.|السجلات وأوقات العمل وتقارير الفريق.', cols: [{ h: 'Team|الفريق', ids: ['employees', 'numbers', 'import', 'doctypes'] }, { h: 'Time|الوقت', ids: ['schedules', 'att-board'] }, { h: 'Reports|التقارير', ids: ['att-report', 'att-statement', 'leave-history'] }] },
  { id: 'catalog', l: 'Catalog|الكتالوج', i: 'tag', d: 'What the business sells.|ما يبيعه النشاط.', cols: [{ h: 'Menu|القائمة', ids: ['services', 'categories', 'packages'] }] },
  { id: 'setup', l: 'Setup|الإعداد', i: 'gear', d: 'Identity, rules and access for this business.|هوية النشاط وقواعده وصلاحياته.', cols: [{ h: 'Business|النشاط', ids: ['identity', 'alerts', 'schedule-rules'] }, { h: 'Access|الوصول', ids: ['permissions', 'security'] }, { h: 'Staff app|تطبيق الموظفات', ids: ['applink', 'appcols'] }] },
];
BLOCK.h = (t) => `<h2 class="sech">${E(t)}</h2>`;
const mIds = (m) => (m.cols ? m.cols.flatMap((c) => c.ids) : [m.page]);
NAV.filter((m) => m.cols).forEach((m) => { PAGES[`hub-${m.id}`] = { hub: m.id, title: m.l, desc: m.d, blocks: m.cols.flatMap((c) => [['h', c.h], ['hub', c.ids]]) }; });
const findM = (id) => (PAGES[id].hub ? NAV.find((m) => m.id === PAGES[id].hub) : NAV.find((m) => mIds(m).includes(root(id))) || NAV[0]);
const link = (p, r) => `<a href="#${p}" ${p === r ? 'aria-current="page"' : ''}>${I(PICON[p])}<span>${E(PAGES[p].title)}</span>${badgeN(COUNTS[p])}</a>`;

const Shell = {
  letter: 'B', name: 'Top bar + hubs',
  mount(app) {
    app.innerHTML = `<div class="shell B">
      <header class="tb"><button class="btn ghost icon mn" data-act="drawer" aria-label="${T('Open navigation|فتح قائمة التنقل')}">${I('menu')}</button>${brand()}
        <nav class="mods" aria-label="${T('Workspace navigation|التنقل في مساحة العمل')}">${NAV.map((m) => (m.page ? `<a class="mb" data-m="${m.id}" href="#${m.page}">${E(m.l)}</a>` : `<button type="button" class="mb" data-m="${m.id}" data-act="mega" aria-expanded="false">${E(m.l)}${badgeN(cnt(mIds(m)))}${I('down')}</button>`)).join('')}</nav>
        <div class="utils">${utils()}</div></header>
      <div class="ctx">${wsBtn('chip')}<div class="cr"></div></div>
      <div class="body"><aside class="ln"></aside><div class="scroll" id="view"></div></div></div>`;
  },
  update(id) {
    this.act('esc');
    const m = findM(id), r = root(id), hub = PAGES[id].hub;
    $$('#app .mb').forEach((b) => { b.toggleAttribute('aria-current', b.dataset.m === m.id); if (b.dataset.m === m.id) b.setAttribute('aria-current', 'page'); });
    const parts = m.page ? [[m.l]] : hub ? [[m.l]] : [[m.l, `hub-${m.id}`], ...(r !== id ? [[PAGES[r].title, r]] : []), [PAGES[id].title]];
    $('#app .cr').innerHTML = crumbs(parts);
    const local = m.cols && !hub;
    $('#app .body').classList.toggle('nol', !local);
    $('#app .ln').innerHTML = local ? `<a class="ov" href="#hub-${m.id}">${I('grid')}<span>${E(m.l)}</span></a>${m.cols.map((c) => `<p>${E(c.h)}</p>${c.ids.map((p) => link(p, r)).join('')}`).join('')}` : '';
    const strip = local ? `<div class="pills strip">${mIds(m).map((p) => `<a href="#${p}" ${p === r ? 'aria-current="page"' : ''}>${E(PAGES[p].title)} ${badgeN(COUNTS[p])}</a>`).join('')}</div>` : '';
    $('#view').innerHTML = pageHTML(id, { top: strip, wide: !!hub });
    const on = $('#view .strip [aria-current]'); if (on) on.scrollIntoView({ block: 'nearest', inline: 'center' });
  },
  act(a, el) {
    const app = $('#app');
    if (a === 'esc' || a === 'mega' || a === 'drawer') {
      const open = $('.mega', app), was = open && open.dataset.m;
      $$('.mega, .drawer, .scrim.n', app).forEach((e) => e.remove());
      $$('.mb[aria-expanded]', app).forEach((b) => b.setAttribute('aria-expanded', 'false'));
      if (a === 'esc' || (a === 'mega' && was === el.dataset.m)) return;
    }
    const scrim = document.createElement('div'); scrim.className = 'scrim n'; scrim.onclick = () => Shell.act('esc');
    const cur = root(route());
    if (a === 'mega') {
      const m = NAV.find((x) => x.id === el.dataset.m); el.setAttribute('aria-expanded', 'true');
      const box = document.createElement('div'); box.className = 'mega card'; box.dataset.m = m.id;
      box.innerHTML = `<div class="mh"><div><h2>${E(m.l)}</h2><p>${E(m.d)}</p></div><a class="btn sm outline" href="#hub-${m.id}">${T('Overview|نظرة عامة')}${I('chev')}</a></div>
        <div class="mc">${m.cols.map((c) => `<div><p>${E(c.h)}</p>${c.ids.map((p) => `<a href="#${p}" ${p === cur ? 'aria-current="page"' : ''}><span class="hi">${I(PICON[p])}</span><span class="tx"><b>${E(PAGES[p].title)} ${badgeN(COUNTS[p])}</b><span>${E(PAGES[p].desc || '')}</span></span></a>`).join('')}</div>`).join('')}</div>`;
      app.append(scrim, box);
    }
    if (a === 'drawer') {
      const m0 = findM(route());
      const d = document.createElement('aside'); d.className = 'drawer';
      d.innerHTML = `<div class="dh">${brand()}<button class="btn ghost icon" data-act="esc" aria-label="${T('Close navigation|إغلاق قائمة التنقل')}">${I('x')}</button></div>${wsBtn()}
        <nav>${NAV.map((m) => (m.page ? `<a class="dl" href="#${m.page}">${I(m.i)}<span>${E(m.l)}</span></a>` : `<details ${m === m0 ? 'open' : ''}><summary class="dl">${I(m.i)}<span>${E(m.l)}</span>${badgeN(cnt(mIds(m)))}${I('down')}</summary><div class="dd"><a href="#hub-${m.id}">${T('Overview|نظرة عامة')}</a>${mIds(m).map((p) => `<a href="#${p}" ${p === cur ? 'aria-current="page"' : ''}>${E(PAGES[p].title)} ${badgeN(COUNTS[p])}</a>`).join('')}</div></details>`)).join('')}</nav>
        <button class="btn outline sm" data-lang="${S.lang === 'ar' ? 'en' : 'ar'}">${S.lang === 'ar' ? 'English' : 'العربية'}</button>`;
      app.append(scrim, d);
    }
  },
};

boot();
</script>
